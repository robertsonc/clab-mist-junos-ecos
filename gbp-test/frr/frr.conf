frr version 10.2.1_git
frr defaults datacenter
hostname gbpt-frr
log stdout informational
no ipv6 forwarding
!
vrf gbptv
 vni 77999
exit-vrf
!
router bgp 65478
 bgp router-id 10.77.77.2
 no bgp default ipv4-unicast
 neighbor 10.77.77.1 remote-as 65477
 neighbor 10.77.77.1 ebgp-multihop 2
 neighbor 10.77.77.1 update-source 10.77.77.2
 neighbor 192.168.77.1 remote-as 65477
 !
 address-family ipv4 unicast
  network 10.77.77.2/32
  neighbor 192.168.77.1 activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 10.77.77.1 activate
  advertise-all-vni
  vni 77001
   rd 10.77.77.2:1
   route-target import 65477:1
   route-target export 65477:1
  exit-vni
 exit-address-family
exit
!
router bgp 65478 vrf gbptv
 bgp router-id 10.77.77.2
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
  route-target import 65477:2
  route-target export 65477:2
 exit-address-family
exit
!
end
