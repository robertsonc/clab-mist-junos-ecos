# LAN-side eBGP to both border switches. lan0/lan1 are /31 uplinks; the site's
# host subnet 10.7.10.0/24 is LEARNED, not connected. BGP is SEGMENT-scoped
# (segment == VRF).
#
# asPrependCount makes ecv-01 preferred (1) over ecv-02 (2), so ecv-02 is
# standby. See the HA MODEL note in the module docstring - this knob is
# documented for ECOS 8.1.6.0-8.2.0.x and these run 9.6.3.0.
segmentBgpSystems:
  - segment: Default
    enable: true
    asn: 65507
    routerId: 198.19.7.1
    enableGracefulRestart: false
    redistToSilverPeak: true
    propagateAsPath: true
    neighbors:
      - peerIpAddress: 10.7.0.1
        peerAsn: 64507
        peerType: PE-router
        sourceIpInterface: lan0
        enableNeighbor: true
        nextHopSelf: false
        asPrependCount: 1
        keepAlive: 30
        holdTime: 90
      - peerIpAddress: 10.7.1.1
        peerAsn: 64507
        peerType: PE-router
        sourceIpInterface: lan1
        enableNeighbor: true
        nextHopSelf: false
        asPrependCount: 1
        keepAlive: 30
        holdTime: 90

loopbackInterface:
  loopbacks:
    - interfaceId: lo0
      adminStatus: Up
      ipAddressMask: 198.19.7.1/32
      zone: Default
      role: default
      segment: Default

segmentLocalRoutes:
  - segment: Default
    routes:
      - routeIpSubnet: 0.0.0.0/0
        nextHop:
        interfaceName:
        metric: 50
        advertise: true
        advertiseToBgp: true
        advertiseToOspf: false
        tag: ANY
        zone:
        comment: Default route
        routeLabel: Internet
