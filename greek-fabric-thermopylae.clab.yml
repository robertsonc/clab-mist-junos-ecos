# =============================================================================
# Mist + EdgeConnect Fabric Lab - TH
# =============================================================================
#
# GENERATED by gen_greek_topology.py - edit the generator, not this file.
#
# Runs on: t430-srv-03
#
# One site of a THREE-SITE SELF-CONTAINED FABRIC. All three run on this one
# host, so the transport stitch never leaves the box: this site's isp-a and
# isp-b attach to the local bridges `br-isp-a` / `br-isp-b`, and the other two
# sites' isp routers hang off the same two bridges. One L2 domain per transport,
# entirely in software.
#
#   isp-a eth3 -> br-isp-a <- isp-a eth3  (the other two sites)
#   isp-b eth3 -> br-isp-b <- isp-b eth3  (the other two sites)
#
# Those bridges have NO physical members and there are no inter-host links. This
# fabric is isolated by design and reuses backbone addressing independently of
# any other lab, so do not add uplinks without renumbering first.
#
# The bridges must already exist. They are owned by /opt/lab/lab-transport.sh,
# installed as lab-transport.service - do not hand-build them, and do not
# expect netplan to have them.
#
#   ISP-A backbone 192.168.100.0/24   this site .5
#   ISP-B backbone 10.100.0.0/24   this site .5
#
# TOPOLOGY - border -> core -> dist -> access, two switches per tier,
# every tier dual-homed to the one above:
#
#      ecv-01  ecv-02        SD-WAN HA pair
#         \      /
#      bd-01 -- bd-02        BORDER  (EC-V handoff + peer link)
#        |  \  /  |
#      co-01    co-02        CORE
#        |  \  /  |
#      di-01    di-02        DIST
#        |  \  /  |
#      ac-01    ac-02        ACCESS
#        |        |
#      vm-01    vm-02        hosts
#
# PORT MAP - uniform on every switch:
#   ge-0/0/0, ge-0/0/1   northbound to the tier above
#                        (on BORDERS these are free - border is the top tier -
#                         so the core downlinks land here instead)
#   ge-0/0/2             border peer link (borders) / host port (access)
#   ge-0/0/3, ge-0/0/4   southbound to the tier below
#                        (on BORDERS: the EC-V lan handoff)
#
#   bd-01: ge-0/0/0,1 -> co-01,co-02   ge-0/0/3 = ecv-01 lan0, ge-0/0/4 = ecv-02 lan0
#   bd-02: ge-0/0/0,1 -> co-01,co-02   ge-0/0/3 = ecv-01 lan1, ge-0/0/4 = ecv-02 lan1
#
# -----------------------------------------------------------------------------
# EC-V NIC MAPPING (vrnetlab aruba_ecos 9.6.3.0) - do not reorder
#   eth0 = mgmt0 | eth1 = wan0 | eth2 = lan0 | eth3 = wan1 | eth4 = lan1
#   eth5 = ha    | eth6 = lan2 (unused here)
# Pinned by the launch script with `interface <name> mac address ethN` + reload,
# so it is deterministic rather than PCI-enumeration luck.
# -----------------------------------------------------------------------------
#
# RESOURCES (this site): 8 vJunos x (5 GB, 4 vCPU) + 2 EC-V x (16 GB, 4 vCPU)
#   = ~72 GB / ~40 vCPU. Note a host may run more than one site.
#   vJunos sizing is hardcoded in vrnetlab's launch.py. EC-V sizing is env-driven
#   (ECOS_VCPU / ECOS_RAM below) after patching the ecos launch.py - 1 vCPU / 4 GB
#   starved the appliances and they flapped in Orchestrator.
#
# ADDRESSING
#   Management  172.30.44.0/24
#     bd .21 .22 | co .23 .24 | di .25 .26 | ac .27 .28 | ecv .29 .30 | vm .31 .32
#     isp-a .10  | isp-b .11
#   ISP-A (Internet)  192.168.109.0/24 (ecv-01), 192.168.110.0/24 (ecv-02)
#   ISP-B (MPLS)      10.100.9.0/24 (ecv-01),  10.100.10.0/24 (ecv-02)
#   Hosts             10.5.10.0/24  vm-01 .11, vm-02 .12, gw .1
# =============================================================================

name: greek-thermopylae

mgmt:
  network: clab-greek-thermopylae
  ipv4-subnet: 172.30.44.0/24

topology:
  kinds:
    juniper_vjunosswitch:
      image: vrnetlab/juniper_vjunos-switch:26.2R1.7
    generic_vm:
      image: vrnetlab/aruba_ecos:9.6.3.0_107217
    linux:
      image: ghcr.io/hellt/network-multitool:latest

  nodes:

    # =========================================================================
    # LOCAL STITCH - pre-existing host bridges shared by all three sites.
    # These must exist before deploy; containerlab attaches to them, it does
    # not create them.
    # =========================================================================
    br-isp-a:
      kind: bridge
    br-isp-b:
      kind: bridge


    # ISP-A / Internet transport for this site.
    # eth1/eth2 -> local EC-V WANs, eth3 -> backbone to the other sites.
    isp-a:
      kind: linux
      mgmt-ipv4: 172.30.44.10
      binds:
        - configs/isp-a-thermopylae-dnsmasq.conf:/etc/dnsmasq.conf:ro
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - ip addr add 192.168.109.1/24 dev eth1
        - ip addr add 192.168.110.1/24 dev eth2
        - ip addr add 192.168.100.5/24 dev eth3
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link set eth3 up
        - ip route replace 192.168.111.0/24 via 192.168.100.6 dev eth3
        - ip route replace 192.168.112.0/24 via 192.168.100.6 dev eth3
        - ip route replace 192.168.113.0/24 via 192.168.100.7 dev eth3
        - ip route replace 192.168.114.0/24 via 192.168.100.7 dev eth3
        - iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
        - iptables -A FORWARD -i eth1 -j ACCEPT
        - iptables -A FORWARD -i eth2 -j ACCEPT
        - iptables -A FORWARD -i eth3 -j ACCEPT
        - iptables -A FORWARD -i eth0 -m state --state RELATED,ESTABLISHED -j ACCEPT
        - apk add --no-cache dnsmasq
        - dnsmasq

    # ISP-B / MPLS transport for this site.
    # eth1/eth2 -> local EC-V WANs, eth3 -> backbone to the other sites.
    isp-b:
      kind: linux
      mgmt-ipv4: 172.30.44.11
      binds:
        - configs/isp-b-thermopylae-dnsmasq.conf:/etc/dnsmasq.conf:ro
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - ip addr add 10.100.9.1/24 dev eth1
        - ip addr add 10.100.10.1/24 dev eth2
        - ip addr add 10.100.0.5/24 dev eth3
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link set eth3 up
        - ip route replace 10.100.11.0/24 via 10.100.0.6 dev eth3
        - ip route replace 10.100.12.0/24 via 10.100.0.6 dev eth3
        - ip route replace 10.100.13.0/24 via 10.100.0.7 dev eth3
        - ip route replace 10.100.14.0/24 via 10.100.0.7 dev eth3
        - iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
        - iptables -A FORWARD -i eth1 -j ACCEPT
        - iptables -A FORWARD -i eth2 -j ACCEPT
        - iptables -A FORWARD -i eth3 -j ACCEPT
        - iptables -A FORWARD -i eth0 -m state --state RELATED,ESTABLISHED -j ACCEPT
        - apk add --no-cache dnsmasq
        - dnsmasq

    # =========================================================================
    # TH FABRIC
    # =========================================================================

    # --- BORDER ---
    TH-vjunos-bd-01:
      kind: juniper_vjunosswitch
      mgmt-ipv4: 172.30.44.21
      group: border
      labels:
        site: thermopylae
        role: border

    TH-vjunos-bd-02:
      kind: juniper_vjunosswitch
      mgmt-ipv4: 172.30.44.22
      group: border
      labels:
        site: thermopylae
        role: border

    # --- CORE ---
    TH-vjunos-co-01:
      kind: juniper_vjunosswitch
      mgmt-ipv4: 172.30.44.23
      group: core
      labels:
        site: thermopylae
        role: core

    TH-vjunos-co-02:
      kind: juniper_vjunosswitch
      mgmt-ipv4: 172.30.44.24
      group: core
      labels:
        site: thermopylae
        role: core

    # --- DIST ---
    TH-vjunos-di-01:
      kind: juniper_vjunosswitch
      mgmt-ipv4: 172.30.44.25
      group: dist
      labels:
        site: thermopylae
        role: dist

    TH-vjunos-di-02:
      kind: juniper_vjunosswitch
      mgmt-ipv4: 172.30.44.26
      group: dist
      labels:
        site: thermopylae
        role: dist

    # --- ACCESS ---
    TH-vjunos-ac-01:
      kind: juniper_vjunosswitch
      mgmt-ipv4: 172.30.44.27
      group: access
      labels:
        site: thermopylae
        role: access

    TH-vjunos-ac-02:
      kind: juniper_vjunosswitch
      mgmt-ipv4: 172.30.44.28
      group: access
      labels:
        site: thermopylae
        role: access

    # --- EdgeConnect Virtual HA pair ---
    TH-ecv-01:
      kind: generic_vm
      mgmt-ipv4: 172.30.44.29
      group: sdwan
      labels:
        site: thermopylae
        role: sdwan
      # Credentials come from a file, not the deploying shell's environment -
      # `${VAR}` expansion silently yields junk if the vars aren't exported.
      env-files:
        - configs/ecos.env
      env:
        ECOS_SITE_TAG: Sitethermopylae
        # 1 vCPU / 4 GB (the old hardcoded default) starves a real EC-V - the
        # appliance flaps in Orchestrator because it loses its management
        # heartbeat. 4 vCPU / 16 GB is the normal allocation.
        # Requires the env-aware launch.py; older images ignore these silently.
        ECOS_VCPU: "4"
        ECOS_RAM: "16384"

    TH-ecv-02:
      kind: generic_vm
      mgmt-ipv4: 172.30.44.30
      group: sdwan
      labels:
        site: thermopylae
        role: sdwan
      # Credentials come from a file, not the deploying shell's environment -
      # `${VAR}` expansion silently yields junk if the vars aren't exported.
      env-files:
        - configs/ecos.env
      env:
        ECOS_SITE_TAG: Sitethermopylae
        # 1 vCPU / 4 GB (the old hardcoded default) starves a real EC-V - the
        # appliance flaps in Orchestrator because it loses its management
        # heartbeat. 4 vCPU / 16 GB is the normal allocation.
        # Requires the env-aware launch.py; older images ignore these silently.
        ECOS_VCPU: "4"
        ECOS_RAM: "16384"

    # --- Ubuntu test hosts ---
    TH-vm-01:
      kind: linux
      image: ubuntu:24.04
      mgmt-ipv4: 172.30.44.31
      cmd: sleep infinity
      group: host
      labels:
        site: thermopylae
        role: host
      exec:
        - >-
          bash -c "apt-get update -qq
          && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq
          iproute2 iputils-ping traceroute tcpdump iperf3 curl >/dev/null 2>&1
          && ip addr add 10.5.10.11/24 dev eth1
          && ip link set eth1 up
          && ip route replace 10.0.0.0/8 via 10.5.10.1 dev eth1"

    TH-vm-02:
      kind: linux
      image: ubuntu:24.04
      mgmt-ipv4: 172.30.44.32
      cmd: sleep infinity
      group: host
      labels:
        site: thermopylae
        role: host
      exec:
        - >-
          bash -c "apt-get update -qq
          && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq
          iproute2 iputils-ping traceroute tcpdump iperf3 curl >/dev/null 2>&1
          && ip addr add 10.5.10.12/24 dev eth1
          && ip link set eth1 up
          && ip route replace 10.0.0.0/8 via 10.5.10.1 dev eth1"

  links:

    # bd <-> co (each co dual-homes to both bd)
    - endpoints: ["TH-vjunos-co-01:ge-0/0/0", "TH-vjunos-bd-01:ge-0/0/0"]
    - endpoints: ["TH-vjunos-co-01:ge-0/0/1", "TH-vjunos-bd-02:ge-0/0/0"]
    - endpoints: ["TH-vjunos-co-02:ge-0/0/0", "TH-vjunos-bd-01:ge-0/0/1"]
    - endpoints: ["TH-vjunos-co-02:ge-0/0/1", "TH-vjunos-bd-02:ge-0/0/1"]

    # co <-> di (each di dual-homes to both co)
    - endpoints: ["TH-vjunos-di-01:ge-0/0/0", "TH-vjunos-co-01:ge-0/0/3"]
    - endpoints: ["TH-vjunos-di-01:ge-0/0/1", "TH-vjunos-co-02:ge-0/0/3"]
    - endpoints: ["TH-vjunos-di-02:ge-0/0/0", "TH-vjunos-co-01:ge-0/0/4"]
    - endpoints: ["TH-vjunos-di-02:ge-0/0/1", "TH-vjunos-co-02:ge-0/0/4"]

    # di <-> ac (each ac dual-homes to both di)
    - endpoints: ["TH-vjunos-ac-01:ge-0/0/0", "TH-vjunos-di-01:ge-0/0/3"]
    - endpoints: ["TH-vjunos-ac-01:ge-0/0/1", "TH-vjunos-di-02:ge-0/0/3"]
    - endpoints: ["TH-vjunos-ac-02:ge-0/0/0", "TH-vjunos-di-01:ge-0/0/4"]
    - endpoints: ["TH-vjunos-ac-02:ge-0/0/1", "TH-vjunos-di-02:ge-0/0/4"]

    # Border peer link (ESI-LAG / MC-LAG ICL toward the EC-Vs)
    - endpoints: ["TH-vjunos-bd-01:ge-0/0/2", "TH-vjunos-bd-02:ge-0/0/2"]

    # EC-V LAN handoff: lan0 (eth2) -> bd-01, lan1 (eth4) -> bd-02
    - endpoints: ["TH-ecv-01:eth2", "TH-vjunos-bd-01:ge-0/0/3"]
    - endpoints: ["TH-ecv-01:eth4", "TH-vjunos-bd-02:ge-0/0/3"]
    - endpoints: ["TH-ecv-02:eth2", "TH-vjunos-bd-01:ge-0/0/4"]
    - endpoints: ["TH-ecv-02:eth4", "TH-vjunos-bd-02:ge-0/0/4"]

    # EC-V HA link (eth5 = ha)
    - endpoints: ["TH-ecv-01:eth5", "TH-ecv-02:eth5"]

    # Hosts -> access layer
    - endpoints: ["TH-vm-01:eth1", "TH-vjunos-ac-01:ge-0/0/2"]
    - endpoints: ["TH-vm-02:eth1", "TH-vjunos-ac-02:ge-0/0/2"]

    # EC-V WAN -> local ISP routers
    - endpoints: ["TH-ecv-01:eth1", "isp-a:eth1"]  # wan0
    - endpoints: ["TH-ecv-01:eth3", "isp-b:eth1"]  # wan1
    - endpoints: ["TH-ecv-02:eth1", "isp-a:eth2"]  # wan0
    - endpoints: ["TH-ecv-02:eth3", "isp-b:eth2"]  # wan1

    # Backbone to the other two sites, via the local bridges.
    # The bridge-side interface name must be unique on the host.
    - endpoints: ["isp-a:eth3", "br-isp-a:th-ispa"]
    - endpoints: ["isp-b:eth3", "br-isp-b:th-ispb"]
