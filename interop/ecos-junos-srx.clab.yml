# =============================================================================
# EC-V + vJunos-switch + vSRX interop lab (2 sites, 9 nodes)
# =============================================================================
#
#                 isp-a (Internet, NAT)              isp-b (MPLS, no NAT)
#                /        |         \                 /            \
#          wan0 /         | untrust  \ wan0     wan1 /              \ wan1
#        BR-ecv-01    DC-srx-01     DC-ecv-01 ------+                |
#           | lan0     |      \ sdwan    | lan0                      |
#           |          |trust  +---------+   (eBGP 65021 <-> 65001)  |
#        BR-sw-01    DC-sw-01                                        |
#           |          |                         BR-ecv-01 wan1 -----+
#        BR-vm-01    DC-vm-01
#
# BRANCH  host - vJunos-switch (L2, VLAN 10) - EC-V lan0 (gateway 10.20.10.1)
# DC      host - vJunos-switch (L2, VLAN 10) - vSRX trust (gateway 10.21.10.1)
#         vSRX sdwan 10.21.0.1/30 <-> EC-V lan0 10.21.0.2/30, eBGP
#         vSRX untrust 192.168.122.2/24 on isp-a: a third-party IPsec endpoint
#         the branch EC-V can reach without going through the DC EC-V.
#
# Day-0 only. The switches and the vSRX boot fully configured from configs/.
# The EC-Vs boot registered and NIC-pinned; their LAN/WAN addressing, BGP and
# overlays are Orchestrator's job (preconfig), exactly as for the Greek fabric.
#
# EC-V NIC MAP (launch.py ECOS_NIC_MAP default) - do not reorder
#   eth0 mgmt0 | eth1 wan0 | eth2 lan0 | eth3 wan1 | eth4 lan1 | eth5 ha | eth6 lan2
#
# RESOURCES  2 EC-V x (4 vCPU, 16 GB) + 2 vJunos-switch x (4, 5 GB) + vSRX (2, 4 GB)
#            = ~46 GB / 18 vCPU. vJunos-switch needs nested virtualisation.
#            Any VM node can be resized with QEMU_SMP / QEMU_MEMORY.
#
# ADDRESSING
#   mgmt        172.30.50.0/24   isp .10 .11 | ecv .21 .22 | srx .31 | sw .41 .42 | vm .51 .52
#   isp-a       192.168.120.0/24 BR-ecv wan0 (DHCP) | .121.0/24 DC-ecv wan0 (DHCP)
#               192.168.122.0/24 DC-srx untrust .2
#   isp-b       10.100.20.0/24   BR-ecv wan1 (DHCP) | 10.100.21.0/24 DC-ecv wan1 (DHCP)
#   LAN         10.20.10.0/24 branch | 10.21.10.0/24 DC | 10.21.0.0/30 srx<->ecv
# =============================================================================

name: ecos-junos-srx

mgmt:
  network: clab-ecos-junos-srx
  ipv4-subnet: 172.30.50.0/24

topology:
  kinds:
    generic_vm:
      image: vrnetlab/aruba_ecos:9.6.3.0_107217
    juniper_vjunosswitch:
      image: vrnetlab/juniper_vjunos-switch:26.2R1.7
    juniper_vsrx:
      # Set this to the tag `make` printed when you built vrnetlab's juniper/vsrx.
      image: vrnetlab/juniper_vsrx:SET-ME
    linux:
      # Unpinned to match the Greek fabric. Pin it on your host with the digest
      # from: docker inspect --format '{{index .RepoDigests 0}}' <image>
      image: ghcr.io/hellt/network-multitool:latest

  nodes:
    # --- transport -----------------------------------------------------------
    isp-a:
      kind: linux
      mgmt-ipv4: 172.30.50.10
      binds:
        - configs/isp-a-dnsmasq.conf:/etc/dnsmasq.conf:ro
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - ip addr add 192.168.120.1/24 dev eth1
        - ip addr add 192.168.121.1/24 dev eth2
        - ip addr add 192.168.122.1/24 dev eth3
        - iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
        - apk add --no-cache dnsmasq
        - dnsmasq
    isp-b:
      kind: linux
      mgmt-ipv4: 172.30.50.11
      binds:
        - configs/isp-b-dnsmasq.conf:/etc/dnsmasq.conf:ro
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - ip addr add 10.100.20.1/24 dev eth1
        - ip addr add 10.100.21.1/24 dev eth2
        - apk add --no-cache dnsmasq
        - dnsmasq

    # --- EdgeConnect ---------------------------------------------------------
    BR-ecv-01:
      kind: generic_vm
      mgmt-ipv4: 172.30.50.21
      env-files:
        - ../configs/ecos.env        # gitignored; see .env.example
      env:
        ECOS_SITE_TAG: SiteBranch
        QEMU_SMP: "4"
        QEMU_MEMORY: "16384"
    DC-ecv-01:
      kind: generic_vm
      mgmt-ipv4: 172.30.50.22
      env-files:
        - ../configs/ecos.env
      env:
        ECOS_SITE_TAG: SiteDC
        QEMU_SMP: "4"
        QEMU_MEMORY: "16384"

    # --- Juniper -------------------------------------------------------------
    DC-srx-01:
      kind: juniper_vsrx
      mgmt-ipv4: 172.30.50.31
      startup-config: configs/DC-srx-01.conf
    BR-sw-01:
      kind: juniper_vjunosswitch
      mgmt-ipv4: 172.30.50.41
      startup-config: configs/access-sw.conf
    DC-sw-01:
      kind: juniper_vjunosswitch
      mgmt-ipv4: 172.30.50.42
      startup-config: configs/access-sw.conf

    # --- hosts ---------------------------------------------------------------
    BR-vm-01:
      kind: linux
      mgmt-ipv4: 172.30.50.51
      exec:
        - ip addr add 10.20.10.11/24 dev eth1
        - ip route replace 10.0.0.0/8 via 10.20.10.1 dev eth1
    DC-vm-01:
      kind: linux
      mgmt-ipv4: 172.30.50.52
      exec:
        - ip addr add 10.21.10.11/24 dev eth1
        - ip route replace 10.0.0.0/8 via 10.21.10.1 dev eth1

  links:
    # branch
    - endpoints: ["BR-ecv-01:eth1", "isp-a:eth1"]          # wan0
    - endpoints: ["BR-ecv-01:eth3", "isp-b:eth1"]          # wan1
    - endpoints: ["BR-ecv-01:eth2", "BR-sw-01:ge-0/0/0"]   # lan0
    - endpoints: ["BR-vm-01:eth1", "BR-sw-01:ge-0/0/1"]
    # DC
    - endpoints: ["DC-ecv-01:eth1", "isp-a:eth2"]          # wan0
    - endpoints: ["DC-ecv-01:eth3", "isp-b:eth2"]          # wan1
    - endpoints: ["DC-ecv-01:eth2", "DC-srx-01:ge-0/0/2"]  # lan0 <-> sdwan zone
    - endpoints: ["DC-srx-01:ge-0/0/0", "isp-a:eth3"]      # untrust
    - endpoints: ["DC-srx-01:ge-0/0/1", "DC-sw-01:ge-0/0/0"]  # trust
    - endpoints: ["DC-vm-01:eth1", "DC-sw-01:ge-0/0/1"]
