# ISP-B (MPLS) DHCP for the EC-V wan1 interfaces. Private transport: isp-b
# routes between the two /24s and does not NAT to the outside.
interface=eth1
dhcp-range=eth1,10.100.20.10,10.100.20.50,255.255.255.0,24h
dhcp-option=eth1,3,10.100.20.1

interface=eth2
dhcp-range=eth2,10.100.21.10,10.100.21.50,255.255.255.0,24h
dhcp-option=eth2,3,10.100.21.1
