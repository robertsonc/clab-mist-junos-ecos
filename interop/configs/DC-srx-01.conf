/* DC firewall. untrust -> isp-a, trust -> DC LAN, sdwan -> DC-ecv-01 lan0 (eBGP). */
interfaces {
    ge-0/0/0 {
        description "untrust: isp-a";
        unit 0 {
            family inet {
                address 192.168.122.2/24;
            }
        }
    }
    ge-0/0/1 {
        description "trust: DC-sw-01";
        unit 0 {
            family inet {
                address 10.21.10.1/24;
            }
        }
    }
    ge-0/0/2 {
        description "sdwan: DC-ecv-01 lan0";
        unit 0 {
            family inet {
                address 10.21.0.1/30;
            }
        }
    }
}
routing-options {
    autonomous-system 65021;
    static {
        route 0.0.0.0/0 next-hop 192.168.122.1;
    }
}
protocols {
    bgp {
        group ECV {
            type external;
            export EXPORT-DC-LAN;
            peer-as 65001;
            neighbor 10.21.0.2;
        }
    }
}
policy-options {
    policy-statement EXPORT-DC-LAN {
        term dc-lan {
            from {
                route-filter 10.21.10.0/24 exact;
            }
            then accept;
        }
        then reject;
    }
}
security {
    nat {
        source {
            rule-set trust-to-untrust {
                from zone trust;
                to zone untrust;
                rule interface-snat {
                    match {
                        source-address 0.0.0.0/0;
                    }
                    then {
                        source-nat {
                            interface;
                        }
                    }
                }
            }
        }
    }
    policies {
        from-zone trust to-zone sdwan {
            policy permit-all {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone sdwan to-zone trust {
            policy permit-all {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone trust to-zone untrust {
            policy permit-all {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
    }
    zones {
        security-zone untrust {
            interfaces {
                ge-0/0/0.0 {
                    host-inbound-traffic {
                        system-services {
                            ping;
                            ike;
                        }
                    }
                }
            }
        }
        security-zone trust {
            interfaces {
                ge-0/0/1.0 {
                    host-inbound-traffic {
                        system-services {
                            ping;
                        }
                    }
                }
            }
        }
        security-zone sdwan {
            interfaces {
                ge-0/0/2.0 {
                    host-inbound-traffic {
                        system-services {
                            ping;
                        }
                        protocols {
                            bgp;
                        }
                    }
                }
            }
        }
    }
}
