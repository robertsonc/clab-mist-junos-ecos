# ISP-A (Internet) DHCP for the EC-V wan0 interfaces. One /24 per appliance.
# eth3 (vSRX untrust) is static and deliberately not served.
interface=eth1
dhcp-range=eth1,192.168.120.10,192.168.120.50,255.255.255.0,24h
dhcp-option=eth1,3,192.168.120.1
dhcp-option=eth1,6,8.8.8.8,8.8.4.4

interface=eth2
dhcp-range=eth2,192.168.121.10,192.168.121.50,255.255.255.0,24h
dhcp-option=eth2,3,192.168.121.1
dhcp-option=eth2,6,8.8.8.8,8.8.4.4
