/* L2 access switch: EC-V / vSRX gateway on ge-0/0/0, host on ge-0/0/1. */
interfaces {
    ge-0/0/0 {
        unit 0 {
            family ethernet-switching {
                interface-mode access;
                vlan {
                    members v10;
                }
            }
        }
    }
    ge-0/0/1 {
        unit 0 {
            family ethernet-switching {
                interface-mode access;
                vlan {
                    members v10;
                }
            }
        }
    }
}
vlans {
    v10 {
        vlan-id 10;
    }
}
